[project]
name = "recyclone-worker"
version = "0.1.0"
description = "Recyclone CV worker: footage -> one DisposalEvent per item that entered a bin (Agent E)."
requires-python = ">=3.12"
dependencies = [
    "ultralytics==8.4.*",
    "opencv-python",
    "numpy",
    "jsonschema",
    "lap",  # ultralytics ByteTrack needs it; it would otherwise auto-install at first run
    "clip @ git+https://github.com/openai/CLIP",
]

[project.scripts]
recyclone-worker = "recyclone_worker.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
